<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>LeagueFM Test Opdracht</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <h1 id="counter">0</h1>
  <button id="button-lager">-1</button>
  <button id="button-hoger">+1</button>

  <script>
    const socket = io('http://localhost:3002');

    const current = document.getElementById('counter');
    const count_hoger = document.getElementById('button-hoger');
    const count_lager = document.getElementById('button-lager');

    socket.on('update', (value) => {
      current.textContent = value;
    });

    count_hoger.addEventListener('click', () => {
      socket.emit('hoger');
    });

    count_lager.addEventListener('click', () => {
      socket.emit('lager');
    });
  </script>
</body>
</html>
